
# =====================================
# APLICACION
# =====================================
spring.application.name=transport-api
server.port=${SERVER_PORT:8081}

# =====================================
# BASE DE DATOS POSTGRESQL
# =====================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transport_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# =====================================
# JPA / HIBERNATE
# =====================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================
# LOGGING
# =====================================
# Structured logging
logging.structured.format.console=logstash

logging.level.root=INFO
logging.level.transport.transport_api=DEBUG
logging.level.org.hibernate.SQL=WARN

spring.jpa.show-sql=false
# =====================================
# Storage de archivos
# =====================================
app.storage.location=${STORAGE_LOCATION:uploads}
# =====================================
# ARCHIVOS MULTIPART
# =====================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# =====================================
# Seguridad         
# =====================================
# JWT Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600
app.jwt.issuer=transport-api

# Authentication credentials
app.security.username=${API_USERNAME:admin}
app.security.password=${API_PASSWORD}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
