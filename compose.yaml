
services:
  postgres:
    image: postgres:17
    container_name: transport-postgres
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transport_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: transport-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/transport_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      STORAGE_LOCATION: /app/uploads
    ports:
      - "8082:8083"
    volumes:
      - assignment_uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  assignment_uploads:
